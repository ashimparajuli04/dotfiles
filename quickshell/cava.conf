# cava config owned by the Quickshell music widget.
#
# Input via pipewire so the visualizer reacts to *any* audio on the default
# sink (not just mpd); never reads /tmp/mpd.fifo, so it cannot steal frames
# from rmpc's cava. Output is raw ascii: one frame per line of ';'-separated
# 0..100 values, parsed by Visualizer.qml.
[general]
framerate = 24
bars = 48
autosens = 1
sensitivity = 100

[input]
method = pipewire

[output]
method = raw
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
monstercat = 0
waves = 0
